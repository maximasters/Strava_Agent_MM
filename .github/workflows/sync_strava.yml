name: Sync Strava Data Daily

on:
  schedule:
    - cron: '30 5 * * *' # Runs daily at 5:30 AM UTC (6:30 AM BST local time)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit data and encrypted credentials changes
      actions: write  # Required to trigger workflow_dispatch for deploy.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Create data directory
        run: mkdir -p data

      # 1. Decrypt credentials file before running sync
      - name: Decrypt Credentials File
        run: |
          node scripts/crypt.js decrypt data/credentials.json.enc data/credentials.json "${{ secrets.CREDENTIALS_PASSPHRASE }}"

      - name: Run Strava synchronization
        run: npm run sync

      # 2. Re-encrypt the updated credentials file (which has rotated refresh tokens)
      - name: Encrypt Updated Credentials File
        run: |
          node scripts/crypt.js encrypt data/credentials.json data/credentials.json.enc "${{ secrets.CREDENTIALS_PASSPHRASE }}"

      # 3. Commit the updated activities data and the encrypted credentials file
      - name: Commit and push updated activities data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/credentials.json.enc
          if [ -f data/activities.json ]; then
            git add data/activities.json
          fi
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-sync Strava activities and credentials [skip ci]"
            git push origin main
          else
            echo "No changes detected. Skipping commit."
          fi

      # 4. Trigger the deployment workflow so the updated data is built and deployed
      - name: Trigger Deployment Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main